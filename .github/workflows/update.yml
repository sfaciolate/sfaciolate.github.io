name: Update Active Domain

on:
  schedule:
    - cron: '0 * * * *' # Viene eseguito ogni ora
  workflow_dispatch: # Permette l'esecuzione manuale

jobs:
  update-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch Active Domain
        run: |
          DOMAIN=$(curl -s "https://dns.google/resolve?name=domain2.streamingcommunity.dev&type=TXT" | jq -r '.Answer[0].data // empty')
          if [ -n "$DOMAIN" ]; then
            echo "https://$DOMAIN" > canale.txt
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add canale.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update active domain" && git push)
