name: Update Active Domain

on:
  schedule:
    - cron: '0 * * * *' # Esegue l'aggiornamento automatico ogni ora
  workflow_dispatch: # Permette di avviare il flusso manualmente da GitHub

jobs:
  update-domain:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Concede i permessi di scrittura necessari per il commit/push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch Active Domain
        run: |
          # Recupera il dominio attivo dal record TXT tramite l'API DoH di Google
          DOMAIN=$(curl -s "https://dns.google/resolve?name=domain2.streamingcommunity.dev&type=TXT" | grep -oP '"data":"\K[^"]+' | head -n 1)
          
          if [ -n "$DOMAIN" ]; then
            echo "Dominio trovato: https://$DOMAIN"

            # 1. Genera canale.txt (Formattato per liste Veezie)
            echo "#LISTA CANALI VEEZIE" > canale.txt
            echo "https://$DOMAIN" >> canale.txt

            # 2. Genera index.html con Reindirizzamento Diretto Istantaneo (NO IFRAME)
            echo '<!DOCTYPE html>' > index.html
            echo '<html lang="it">' >> index.html
            echo '<head>' >> index.html
            echo '  <meta charset="UTF-8">' >> index.html
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0">' >> index.html
            echo "  <meta http-equiv=\"refresh\" content=\"0;url=https://$DOMAIN\">" >> index.html
            echo '  <title>Reindirizzamento...</title>' >> index.html
            echo '  <script>' >> index.html
            echo "    window.location.replace(\"https://$DOMAIN\");" >> index.html
            echo '  </script>' >> index.html
            echo '  <style>' >> index.html
            echo '    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }' >> index.html
            echo '    a { color: #38bdf8; text-decoration: none; font-weight: bold; }' >> index.html
            echo '  </style>' >> index.html
            echo '</head>' >> index.html
            echo '<body>' >> index.html
            echo "  <p>Reindirizzamento a <a href=\"https://$DOMAIN\">https://$DOMAIN</a>...</p>" >> index.html
            echo '</body>' >> index.html
            echo '</html>' >> index.html
          else
            echo "Errore: Impossibile recuperare il dominio attivo."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add canale.txt index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Remove iframe and enforce clean JS redirect" && git push)
